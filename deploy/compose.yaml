services:
  app:
    image: stratdeck:${RELEASE_ID}
    restart: unless-stopped
    env_file:
      - /opt/stratdeck/shared/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4178
      PASSWORD_FILE: /data/password.json
      DATABASE_PATH: /data/playbook.sqlite
      MEDIA_DIR: /data/media
    expose:
      - "4178"
    volumes:
      - /opt/stratdeck/shared/data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4178/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      PUBLIC_IP: ${PUBLIC_IP}
    restart: unless-stopped
    ports:
      - "${PUBLIC_IP}:8443:8443"
    volumes:
      - /opt/stratdeck/config/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/stratdeck/shared/caddy-data:/data
      - /opt/stratdeck/shared/caddy-config:/config
    networks:
      - private
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

networks:
  private:
    name: stratdeck-private
    driver: bridge
